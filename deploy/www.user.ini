; Appliqué par PHP-FPM à tout le dossier www/ (contrairement aux directives
; php_value/php_flag d'un .htaccess, qui ne fonctionnent pas sous PHP-FPM).
; Filament/Livewire consomment plus de mémoire qu'une appli Laravel minimale
; (ex: livewire.min.js est servi dynamiquement, pas comme fichier statique,
; et traverse tout le bootstrap de l'app) — le défaut mutualisé (128M) est
; trop juste et provoque des 503 intermittents en production.
memory_limit = 256M
max_execution_time = 60
